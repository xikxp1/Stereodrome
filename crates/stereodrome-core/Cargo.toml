[package]
name = "stereodrome-core"
version = "0.3.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.33"
md5 = "0.8.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "form",
  "system-proxy",
  "rustls-no-provider",
] }
ringbuf = "0.5.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stereodrome-audio = { version = "0.3.1", path = "../stereodrome-audio" }
submarine = { version = "0.1.1", path = "../submarine" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
ts-rs = { version = "12.0.1", default-features = false, features = [
  "serde-compat",
  "serde-json-impl",
], optional = true }
url = "2.5.8"
urlencoding = "2.1.3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
# Enables `TS` derives used by the `export-protocol-types` binary. Kept off by
# default so desktop and mobile builds do not link the generator.
ts = ["dep:ts-rs"]

[[bin]]
name = "export-protocol-types"
required-features = ["ts"]
