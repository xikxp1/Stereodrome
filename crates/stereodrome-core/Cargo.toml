[package]
name = "stereodrome-core"
version = "0.1.23"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
log = "0.4.29"
md5 = "0.8.0"
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "system-proxy", "rustls-no-provider"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
submarine = "0.1.1"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
url = "2.5.8"
urlencoding = "2.1.3"
