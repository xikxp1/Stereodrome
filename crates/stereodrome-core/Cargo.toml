[package]
name = "stereodrome-core"
version = "0.1.17"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
md5 = "0.8.0"
rand = "0.10.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
submarine = "0.1.1"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
url = "2.5.8"
urlencoding = "2.1.3"
