[package]
name = "stereodrome-ffi"
version = "0.3.1"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stereodrome-core = { path = "../stereodrome-core" }
tokio = { version = "1.53.1", features = ["full"] }
