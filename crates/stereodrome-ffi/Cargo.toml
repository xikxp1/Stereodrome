[package]
name = "stereodrome-ffi"
version = "0.1.23"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
stereodrome-audio = { path = "../stereodrome-audio" }
stereodrome-core = { path = "../stereodrome-core" }
tokio = { version = "1.52.2", features = ["full"] }
url = "2.5.8"
