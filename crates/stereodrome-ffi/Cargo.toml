[package]
name = "stereodrome-ffi"
version = "0.2.1"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stereodrome-core = { path = "../stereodrome-core" }
tokio = { version = "1.52.3", features = ["full"] }
