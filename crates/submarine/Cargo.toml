[package]
name = "submarine"
version = "0.1.1"
edition = "2021"
authors = ["Thomas Eppers"]
description = "A library for connecting with a subsonic server (Stereodrome vendored fork)"
readme = "Readme.md"
repository = "https://github.com/eppixx/submarine"
documentation = "https://docs.rs/submarine"
license = "MIT"
keywords = ["subsonic", "api", "music", "streaming", "REST"]
categories = ["api-bindings", "multimedia::audio", "network-programming"]

# Vendored fork of submarine 0.1.1. Local changes:
# - Binary endpoints (stream, download, getCoverArt, getAvatar, hls, getCaptions)
#   reuse the stored reqwest::Client instead of building a fresh Client (TLS
#   config + connection pool) per request via reqwest::get.
# - Response bodies are no longer copied a second time via .to_vec().
# - reqwest is aligned with the workspace (0.13, rustls-no-provider) so the app
#   ships a single HTTP/TLS stack.

[features]
navidrome = []

[dependencies]
log = "0.4.17"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "query",
  "rustls-no-provider",
] }
md5 = "0.7.0"
chrono = { version = "0.4.23", features = ["std", "serde"] }
rand = "0.8.5" # for creating salt
thiserror = "1.0.38"
cfg-if = "1.0.0"
url = "2.4.1"

[dev-dependencies]
tokio = { version = "1.32.0", features = ["full"] }
