[package]
name = "stereodrome"
version = "0.1.0"
description = "Desktop music player for Subsonic-compatible music servers"
authors = ["Ivan Kachalkin<xikxp1@gmail.com>"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stereodrome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
log = "0.4.29"
rand = "0.9"
ringbuf = "0.4.8"
rodio = { version = "0.21", features = ["symphonia-all"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8"
submarine = "0.1"
tantivy = "0.25"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "4.0.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.3.7"
tauri-plugin-store = "2.4.2"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
uuid = { version = "1.19.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.9.0"
