[package]
name = "stereodrome"
version = "0.2.0"
description = "Desktop music player for Subsonic-compatible music servers"
authors = ["Ivan Kachalkin<xikxp1@gmail.com>"]
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stereodrome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
bs2b = { version = "0.2.0", features = ["streaming"] }
chrono = { version = "0.4.45", features = ["serde"] }
ebur128 = "0.1.10"
filetime = "0.2.29"
fundsp = "0.23.0"
keyring = { version = "4.1.4", features = ["cli"] }
keyring-core = "1.0.0"
log = "0.4.33"
md5 = "0.8.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "system-proxy"] }
ringbuf = "0.5.0"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
souvlaki = "0.8.3"
stereodrome-audio = { version = "0.2.0", path = "../crates/stereodrome-audio" }
stereodrome-core = { version = "0.2.0", path = "../crates/stereodrome-core" }
submarine = "0.1.1"
tantivy = "0.26.1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-prevent-default = "5.0.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-store = "2.4.3"
thiserror = "2.0.18"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.4", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"
