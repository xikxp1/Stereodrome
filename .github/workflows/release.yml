name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
  LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.release_version }}

    steps:
      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          RAW_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          RELEASE_VERSION="${RAW_VERSION#v}"

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be semver, got '$RAW_VERSION'"
            exit 1
          fi

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

  validate_release_version:
    name: Validate release version
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check versioned files
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const expected = process.env.RELEASE_VERSION;
          const failures = [];

          function checkJson(path, getVersion = (json) => json.version) {
            const actual = getVersion(JSON.parse(fs.readFileSync(path, "utf8")));
            if (actual !== expected) {
              failures.push(`${path}: expected ${expected}, got ${actual ?? "<missing>"}`);
            }
          }

          function checkCargoPackage(path) {
            const text = fs.readFileSync(path, "utf8");
            const match = text.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m);
            const actual = match?.[1];
            if (actual !== expected) {
              failures.push(`${path}: expected ${expected}, got ${actual ?? "<missing>"}`);
            }
          }

          function checkGradle(path) {
            const text = fs.readFileSync(path, "utf8");
            const projectVersion = text.match(/^version = '([^']+)'/m)?.[1];
            const versionName = text.match(/^\s*versionName "([^"]+)"/m)?.[1];

            if (projectVersion !== expected) {
              failures.push(`${path}: expected project version ${expected}, got ${projectVersion ?? "<missing>"}`);
            }

            if (versionName !== expected) {
              failures.push(`${path}: expected versionName ${expected}, got ${versionName ?? "<missing>"}`);
            }
          }

          [
            "src-tauri/Cargo.toml",
            "crates/stereodrome-audio/Cargo.toml",
            "crates/stereodrome-core/Cargo.toml",
            "crates/stereodrome-ffi/Cargo.toml",
          ].forEach(checkCargoPackage);

          checkJson("mobile/app.json", (json) => json.expo?.version);
          checkJson("mobile/modules/stereodrome-core/package.json");

          checkGradle("mobile/modules/stereodrome-core/android/build.gradle");

          if (failures.length > 0) {
            console.error("Release version does not match versioned files:");
            for (const failure of failures) {
              console.error(`- ${failure}`);
            }
            console.error(`Run: vp node scripts/set-version.mjs ${expected}`);
            process.exit(1);
          }
          NODE

  prepare_release:
    name: Prepare GitHub release
    needs: [version, validate_release_version]
    runs-on: ubuntu-latest

    steps:
      - name: Remove existing release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.version.outputs.release_version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
            echo "Deleted existing release $RELEASE_TAG before uploading fresh artifacts."
          else
            echo "No existing release $RELEASE_TAG found."
          fi

  release_notes:
    name: Compose release notes
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.release_body.outputs.release_body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          echo 'changelog<<EOF' >> $GITHUB_OUTPUT
          git-cliff --latest --strip all --use-branch-tags >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Compose release body
        id: release_body
        shell: bash
        run: |
          echo 'release_body<<EOF' >> $GITHUB_OUTPUT
          echo "${{ steps.changelog.outputs.changelog }}" >> $GITHUB_OUTPUT
          cat <<'MARKDOWN' >> $GITHUB_OUTPUT

          ## Installation

          | Platform | Download |
          |----------|----------|
          | macOS (Universal) | [DMG](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome_${{ needs.version.outputs.release_version }}_universal.dmg) |
          | Windows | [MSI](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome_${{ needs.version.outputs.release_version }}_x64_en-US.msi) or [EXE](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome_${{ needs.version.outputs.release_version }}_x64-setup.exe) |
          | Linux | [AppImage](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome_${{ needs.version.outputs.release_version }}_amd64.AppImage), [DEB](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome_${{ needs.version.outputs.release_version }}_amd64.deb), or [RPM](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome-${{ needs.version.outputs.release_version }}-1.x86_64.rpm) |
          | Android | [APK](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome-android.apk) or [AAB](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome-android.aab) |
          | iOS | [IPA](https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.release_version }}/Stereodrome.ipa) or TestFlight |

          ## Auto-Update

          Existing installations will automatically receive this update.
          MARKDOWN
          echo 'EOF' >> $GITHUB_OUTPUT

  build:
    needs: [version, validate_release_version, prepare_release, release_notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.18.0"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Init Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-rust
          cache-bin: false

      - name: Verify Rust toolchain
        shell: bash
        run: |
          toolchain_cargo="$(rustup which cargo)"
          if [ -x "$HOME/.cargo/bin/cargo" ] && "$HOME/.cargo/bin/cargo" --help 2>&1 | grep -q rustup-init; then
            rm -f "$HOME/.cargo/bin/cargo"
          fi
          if command -v cygpath >/dev/null; then
            toolchain_bin="$(dirname "$(cygpath -u "$toolchain_cargo")")"
            echo "$(cygpath -w "$HOME/.cargo/bin")" >> "$GITHUB_PATH"
            echo "$(cygpath -w "$toolchain_bin")" >> "$GITHUB_PATH"
          else
            toolchain_bin="$(dirname "$toolchain_cargo")"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            echo "$toolchain_bin" >> "$GITHUB_PATH"
          fi
          export PATH="$toolchain_bin:$HOME/.cargo/bin:$PATH"
          which rustc
          rustc --version
          which cargo
          cargo --version
          cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      - name: Import Apple Developer Certificate (MacOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Certificate (MacOS)
        if: matrix.platform == 'macos-latest'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Install frontend dependencies
        run: vp install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          tagName: v${{ needs.version.outputs.release_version }}
          releaseName: "Stereodrome v${{ needs.version.outputs.release_version }}"
          releaseBody: ${{ needs.release_notes.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  mobile-android:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.18.0"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Init Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
          prefix-key: v1-rust
          cache-bin: false

      - name: Verify Rust toolchain
        shell: bash
        run: |
          toolchain_cargo="$(rustup which cargo)"
          if [ -x "$HOME/.cargo/bin/cargo" ] && "$HOME/.cargo/bin/cargo" --help 2>&1 | grep -q rustup-init; then
            rm -f "$HOME/.cargo/bin/cargo"
          fi
          if command -v cygpath >/dev/null; then
            toolchain_bin="$(dirname "$(cygpath -u "$toolchain_cargo")")"
            echo "$(cygpath -w "$HOME/.cargo/bin")" >> "$GITHUB_PATH"
            echo "$(cygpath -w "$toolchain_bin")" >> "$GITHUB_PATH"
          else
            toolchain_bin="$(dirname "$toolchain_cargo")"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            echo "$toolchain_bin" >> "$GITHUB_PATH"
          fi
          export PATH="$toolchain_bin:$HOME/.cargo/bin:$PATH"
          which rustc
          rustc --version
          which cargo
          cargo --version
          cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install mobile dependencies
        working-directory: mobile
        run: vp install --frozen-lockfile

      - name: Build Android Rust core
        run: scripts/build-mobile-rust.sh android

      - name: Generate Android project
        working-directory: mobile
        run: vp exec expo prebuild --platform android --no-install

      - name: Build Android release app
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare Android release assets
        shell: bash
        run: |
          shopt -s nullglob
          apk_files=(mobile/android/app/build/outputs/apk/release/*.apk)
          aab_files=(mobile/android/app/build/outputs/bundle/release/*.aab)

          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apk_files[@]}"
            exit 1
          fi

          if [ "${#aab_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release AAB, found ${#aab_files[@]}"
            exit 1
          fi

          mkdir -p mobile/build/android
          cp "${apk_files[0]}" mobile/build/android/Stereodrome-android.apk
          cp "${aab_files[0]}" mobile/build/android/Stereodrome-android.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stereodrome-mobile-android-release
          path: |
            mobile/build/android/Stereodrome-android.apk
            mobile/build/android/Stereodrome-android.aab
          if-no-files-found: error

      - name: Upload Android artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "v${{ needs.version.outputs.release_version }}" \
            mobile/build/android/Stereodrome-android.apk \
            mobile/build/android/Stereodrome-android.aab \
            --clobber

  mobile-ios:
    needs: [version, build]
    runs-on: macos-26
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EAS_PROJECT_SLUG: stereodrome
      IOS_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.18.0"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Select Xcode 26.3
        shell: bash
        run: |
          # Xcode 26.4.1 on macos-26 currently fails Release archives while linking SwiftUICore.
          xcode_app=/Applications/Xcode_26.3.app
          if [ ! -d "$xcode_app" ]; then
            echo "::error::$xcode_app is required for iOS release builds"
            exit 1
          fi
          sudo xcode-select -s "$xcode_app/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Init Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
          prefix-key: v1-rust
          cache-bin: false

      - name: Verify Rust toolchain
        shell: bash
        run: |
          toolchain_cargo="$(rustup which cargo)"
          if [ -x "$HOME/.cargo/bin/cargo" ] && "$HOME/.cargo/bin/cargo" --help 2>&1 | grep -q rustup-init; then
            rm -f "$HOME/.cargo/bin/cargo"
          fi
          if command -v cygpath >/dev/null; then
            toolchain_bin="$(dirname "$(cygpath -u "$toolchain_cargo")")"
            echo "$(cygpath -w "$HOME/.cargo/bin")" >> "$GITHUB_PATH"
            echo "$(cygpath -w "$toolchain_bin")" >> "$GITHUB_PATH"
          else
            toolchain_bin="$(dirname "$toolchain_cargo")"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            echo "$toolchain_bin" >> "$GITHUB_PATH"
          fi
          export PATH="$toolchain_bin:$HOME/.cargo/bin:$PATH"
          which rustc
          rustc --version
          which cargo
          cargo --version
          cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile
        run: vp install --frozen-lockfile

      - name: Validate iOS release secrets
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          for secret_name in \
            EXPO_TOKEN \
            EAS_PROJECT_ID \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::$secret_name is required for iOS local EAS release builds"
              exit 1
            fi
          done

      - name: Generate iOS project
        working-directory: mobile
        run: vp exec expo prebuild --platform ios --clean --no-install

      - name: Build iOS Rust core
        run: scripts/build-mobile-rust.sh ios

      - name: Build iOS IPA with local EAS
        working-directory: mobile
        env:
          NODE_ENV: production
        run: |
          mkdir -p build/ios
          vp dlx eas-cli build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output build/ios/Stereodrome.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: stereodrome-mobile-ios-ipa
          path: mobile/build/ios/Stereodrome.ipa
          if-no-files-found: error

      - name: Upload iOS IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "v${{ needs.version.outputs.release_version }}" \
            mobile/build/ios/Stereodrome.ipa \
            --clobber

      - name: Upload iOS IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: mobile/build/ios/Stereodrome.ipa
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: "true"
          backend: appstore-api
