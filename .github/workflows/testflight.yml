name: Upload iOS IPA to TestFlight

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release workflow run ID that produced the iOS IPA artifact"
        required: true
        type: string
      uses_non_exempt_encryption:
        description: "Set to true if the build uses non-exempt encryption"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  upload-testflight:
    name: Upload IPA to TestFlight
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate App Store Connect secrets
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          for secret_name in \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::$secret_name is required for TestFlight uploads"
              exit 1
            fi
          done

      - name: Download iOS IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}"
          IPA_DIR="$RUNNER_TEMP/testflight-ipa"
          mkdir -p "$IPA_DIR"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name stereodrome-mobile-ios-ipa \
            --dir "$IPA_DIR"

          IPA_PATH="$(find "$IPA_DIR" -type f -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa file found in stereodrome-mobile-ios-ipa artifact"
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Found IPA: $IPA_PATH"

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: ${{ github.event_name == 'workflow_dispatch' && inputs.uses_non_exempt_encryption || 'false' }}
          wait-for-processing: "true"
          backend: appstore-api
