name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.18.0"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Init Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-rust
          cache-bin: false

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Audit frontend dependencies
        run: vp pm audit --production

      - name: Check generated protocol types are current
        run: vp run protocol:types:check

      - name: Check frontend
        run: vp check

      - name: Check Svelte frontend
        run: vp run check:svelte

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features

      - name: Build desktop app
        run: vp exec tauri build --no-bundle

  mobile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.18.0"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Init Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
          prefix-key: v1-rust
          cache-bin: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install mobile dependencies
        working-directory: mobile
        run: vp install --frozen-lockfile

      - name: Type check mobile
        working-directory: mobile
        run: vp run typecheck

      - name: Check mobile
        working-directory: mobile
        run: vp check

      - name: Audit mobile dependencies
        working-directory: mobile
        # xcode uses uuid.v4 only; GHSA-w5hq-g745-h8pq affects buffered v3/v5/v6.
        # image-size has no patched release yet; Metro only uses it on local image assets.
        run: >-
          vp pm audit --
          --ignore GHSA-w5hq-g745-h8pq
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-2v37-7h3g-55p8

      - name: Build Android Rust core
        run: scripts/build-mobile-rust.sh android

      - name: Generate Android project
        working-directory: mobile
        run: vp exec expo prebuild --platform android --no-install

      - name: Build Android app
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon

  mobile-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.18.0"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Init Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
          prefix-key: v1-rust
          cache-bin: false

      - name: Install mobile dependencies
        working-directory: mobile
        run: vp install --frozen-lockfile

      - name: Type check mobile
        working-directory: mobile
        run: vp run typecheck

      - name: Check mobile
        working-directory: mobile
        run: vp check

      - name: Build iOS Rust core
        run: scripts/build-mobile-rust.sh ios

      - name: Generate iOS project
        working-directory: mobile
        run: vp exec expo prebuild --platform ios --no-install

      - name: Install iOS pods
        working-directory: mobile/ios
        run: pod install

      - name: Build iOS simulator app
        working-directory: mobile
        run: |
          set -o pipefail
          LOG_PATH="$RUNNER_TEMP/xcodebuild-ios-simulator.log"
          SIM_ARCH="$(uname -m)"

          if ! xcodebuild \
            -workspace ios/Stereodrome.xcworkspace \
            -scheme Stereodrome \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -jobs 2 \
            ARCHS="$SIM_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_DEBUG_DYLIB=NO \
            build 2>&1 | tee "$LOG_PATH"; then
            echo "::group::xcodebuild errors"
            grep -E "error:|fatal error:|Command .* failed|BUILD FAILED|\\*\\* BUILD FAILED \\*\\*" "$LOG_PATH" || true
            echo "::endgroup::"
            exit 1
          fi
